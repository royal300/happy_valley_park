server {
    listen 80;
    server_name fend.gohappyvalley.com;

    root /var/www/happyvalley_frontend/updated_ui_react_version/dist;
    index index.html index.htm index.php;

    access_log /var/log/nginx/fend.gohappyvalley.com.access.log;
    error_log  /var/log/nginx/fend.gohappyvalley.com.error.log;

    # Serve React Frontend
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to PHP Backend
    location /backend/api/ {
        alias /var/www/happyvalley_frontend/updated_ui_react_version/dist/backend/api/;
        try_files $uri $uri/ /backend/api/index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            # Updated to match VPS PHP version
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # Deny access to hidden files
    location ~ /\.ht {
        deny all;
    }
}
